name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Typecheck, unit tests, frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install (root workspace - frontend, ai/*, backend/*)
        run: npm ci

      - name: Typecheck (ai/*, backend/shared-types project refs + frontend)
        run: npm run typecheck

      - name: Unit tests (ai-judge, ai-coach - vitest, no live API keys needed)
        run: npm test

      - name: Frontend production build
        run: npm run build

  python:
    name: Python lint + tests (ai/python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (with dev extras - pytest, ruff)
        run: pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest -q

  backend-smoke:
    name: backend/api boots + AI gateway self-builds from a clean checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install (root workspace)
        run: npm ci

      - name: Syntax-check every backend/api JS file
        run: find backend/api -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check

      # A fresh checkout has no ai/ai-client/dist (it's a gitignored build
      # artifact) - this proves backend/api's prestart hook
      # (scripts/ensure-ai-client-built.js) really does self-heal that on a
      # from-scratch clone, not just on a machine that already built it once.
      - name: Boot backend/api (no MongoDB needed - auth/AI routes only) and check health
        working-directory: backend/api
        run: |
          JWT_SECRET=ci-test-secret PORT=5050 NODE_ENV=test npm start &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5050/api/health > /tmp/health.json; then
              echo "Backend healthy:"; cat /tmp/health.json; exit 0
            fi
            sleep 1
          done
          echo "Backend never became healthy"; exit 1

      - name: AI route requires auth (401 without a token)
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:5050/api/ai/coach/message \
            -H 'Content-Type: application/json' -d '{"message":"hi"}')
          if [ "$status" != "401" ]; then
            echo "expected 401, got $status"; exit 1
          fi
          echo "AI gateway correctly rejects unauthenticated requests (401)"
